{% extends "base.html" %}

{% block title %}{{ error_title }} - GramKart{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 py-16 bg-gradient-to-br from-emerald-50/20 via-white to-emerald-50/10">
    <div class="w-20 h-20 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mb-6 shadow-sm border border-rose-100 animate-bounce">
        <i class="fa-solid fa-circle-exclamation text-4xl"></i>
    </div>
    
    <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight sm:text-5xl Poppins mb-3">
        {{ error_title }}
    </h1>
    
    <p class="text-lg text-slate-500 max-w-md mx-auto mb-8 font-medium">
        {{ error_msg }}
    </p>
    
    <div class="flex flex-wrap gap-4 justify-center">
        <a href="{{ url_for('client.index') }}" class="px-6 py-3 rounded-full bg-primary-600 text-white font-bold hover:bg-primary-700 transition duration-200 shadow-lg shadow-primary-600/20 flex items-center gap-2">
            <i class="fa-solid fa-house"></i> Back to Home
        </a>
        <a href="{{ url_for('client.profile') }}" class="px-6 py-3 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold transition duration-200 flex items-center gap-2">
            <i class="fa-solid fa-user"></i> View Profile
        </a>
    </div>
</div>
{% endblock %}
