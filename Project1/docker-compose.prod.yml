version: '3.8'

services:
  web:
    build: .
    container_name: gramkart_web
    restart: always
    expose:
      - "8000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://gramkart_admin:secure_pg_password_2026@db:5432/gramkart_prod
      - REDIS_URL=redis://redis:6379/0
      - CACHE_TYPE=RedisCache
      - RATELIMIT_STORAGE_URI=redis://redis:6379/1
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    container_name: gramkart_db
    restart: always
    environment:
      - POSTGRES_USER=gramkart_admin
      - POSTGRES_PASSWORD=secure_pg_password_2026
      - POSTGRES_DB=gramkart_prod
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    container_name: gramkart_redis
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    container_name: gramkart_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
    depends_on:
      - web

volumes:
  pg_data:
  redis_data:
